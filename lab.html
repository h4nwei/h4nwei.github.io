<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hanwei Zhu - Lab</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
  <link rel="stylesheet" href="https://at.alicdn.com/t/c/font_1155135_w0owrxa96yp.css">
  <link rel="stylesheet" type="text/css" href="css/style.css">
  <link rel="stylesheet" type="text/css" href="css/fonts.css">
</head>
<body data-page="lab">
  <div id="site-nav-placeholder"></div>

  <div class="main-container">
    <div class="content-container font-hei" id="lab-page-root">
      <h2>Lab</h2>
      <hr>
      <p class="lab-tagline">Welcome to our lab. We work on visual intelligence and efficient AI.</p>

      <section class="lab-section">
        <h3>Openings</h3>
        <p id="openings-intro">Loading openings...</p>

        <h4>Available Positions</h4>
        <ul id="openings-positions"></ul>

        <h4>Research Topics</h4>
        <ul id="openings-topics"></ul>

        <div class="openings-contact-box" id="openings-contact"></div>
      </section>

      <section class="lab-section">
        <h3>Lab Members</h3>

        <h4>Lead</h4>
        <div class="member-grid" id="lead-members"></div>

        <h4>PhD Students</h4>
        <div class="member-grid" id="phd-members"></div>

        <h4>Master Students</h4>
        <div class="member-grid" id="master-members"></div>

        <h4>Visiting Students</h4>
        <div class="member-grid" id="visiting-members"></div>

        <h4>Alumni</h4>
        <div class="member-grid" id="alumni-members"></div>
      </section>
    </div>
  </div>

  <script src="js/navigation.js"></script>
  <script src="js/lab.js"></script>
</body>
</html>
