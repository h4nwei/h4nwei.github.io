<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hanwei Zhu - Publications</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
  <link rel="stylesheet" href="https://at.alicdn.com/t/c/font_1155135_w0owrxa96yp.css">
  <link rel="stylesheet" type="text/css" href="css/style.css">
  <link rel="stylesheet" type="text/css" href="css/fonts.css">
</head>
<body data-page="publications">
  <div id="site-nav-placeholder"></div>

  <div class="main-container">
    <div class="content-container font-hei">
      <h2>Publications</h2>
      <hr>
      <p>
        <a href="https://scholar.google.com/citations?hl=en&user=-52izjkAAAAJ" target="_blank">[Google Scholar]</a>
        <span>(<sup>*</sup> equal contribution.)</span>
      </p>

      <div class="pub-filter-group">
        <button class="pub-filter-btn active" data-filter="all" type="button">All</button>
        <button class="pub-filter-btn" data-filter="preprint" type="button">Preprints</button>
        <button class="pub-filter-btn" data-filter="conference" type="button">Conferences</button>
        <button class="pub-filter-btn" data-filter="journal" type="button">Journals</button>
      </div>

      <div id="full-publication">
        <section id="section-preprint">
          <h3>Preprint Papers</h3>
          <ol class="preprint"></ol>
        </section>
        <section id="section-conference">
          <h3>Conference Papers</h3>
          <ol class="conference"></ol>
        </section>
        <section id="section-journal">
          <h3>Journal Papers</h3>
          <ol class="journal"></ol>
        </section>
      </div>
    </div>
  </div>

  <script src="js/navigation.js"></script>
  <script src="publications.js"></script>
  <script src="js/publications-render.js"></script>
</body>
</html>
